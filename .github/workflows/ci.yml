name: CI
# Runs every test and the requirements traceability check.
# A green run on dev also triggers the dev page deploy (see pages.yml).
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Fetch pinned WebLLM source for the CPU admission audit
        run: curl --fail --location --connect-timeout 15 --max-time 60 --retry 3 https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.87/lib/index.js -o "${{ runner.temp }}/webllm-0.2.87.js"
      - run: npm test
        env:
          MP_WEBLLM_AUDIT_BUNDLE: ${{ runner.temp }}/webllm-0.2.87.js
      - run: node scripts/build.mjs --channel ${{ (github.base_ref || github.ref_name) == 'main' && 'stable' || 'dev' }}
      - uses: actions/upload-artifact@v4
        with:
          name: master-plan-${{ (github.base_ref || github.ref_name) == 'main' && 'stable' || 'dev' }}
          path: dist/
