name: Deploy to GitHub Pages
# Publishes both channels to one Pages site:
#   /       stable game, built from main
#   /dev/   dev game, built from dev
# Runs on pushes to main, and after CI passes on dev. The dev path uses
# workflow_run, which runs from main, so the github-pages environment only
# needs to allow main.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: stable
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: dev
          path: dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build stable (main)
        working-directory: stable
        run: npm run test:core && node scripts/build.mjs --channel stable --out ../site
      - name: Build dev
        run: |
          if [ -f dev/package.json ]; then
            cd dev && npm run test:core && node scripts/build.mjs --channel dev --out ../site/dev
          else
            echo "No dev branch yet; skipping /dev/"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
