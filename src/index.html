<title>Master Plan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/*HOST_GROTESK_LICENSE*/
/* MP-058: light paper surfaces, restrained corners and no callout side bars. */
@font-face{font-family:"Host Grotesk";font-style:normal;font-weight:300 800;font-display:swap;src:url(data:font/woff2;base64,/*HOST_GROTESK*/) format("woff2")}
:root{
  color-scheme:light;
  --bg:#FBF9F6; --surface:#FFFEFD; --surface-2:#F5F2ED; --fg:#29231F; --muted:#6B6057; --line:#EEE9E3; --control-line:#94897D;
  --accent:#33CC7A; --accent-fg:#1B1411; --accent-ink:#1F3954; --accent-tint:#E8F3E6; --gold:#674C20; --gold-tint:#F3EAD8;
  --good:#24764A; --bad:#A5392B; --scrim:rgba(41,35,31,.32); --map-bg:#D9E3D0; --paper:#F8F5ED; --ink:#1E1B16;
  --f-display:"Host Grotesk","Segoe UI",system-ui,sans-serif; --f-body:var(--f-display);
  --f-mono:"Host Grotesk",ui-monospace,"SFMono-Regular",Menlo,monospace; --f-news:Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent-ink);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:24px 140px}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-bottom:8px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.seal{width:40px;height:44px;flex:none}
.eyebrow{font:600 12px/1.3 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font:600 25px/1.15 var(--f-display);margin:6px 0 0;letter-spacing:-.035em;text-wrap:balance}
.when{text-align:right;display:flex;align-items:center;gap:14px}
.yr{font:600 26px/1.1 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--accent-ink)}
.sub{font-size:12px;color:var(--muted);margin-top:4px}
.iconbtn{flex:0 0 44px;width:44px;height:44px;border:1px solid var(--control-line);background:var(--surface);border-radius:8px;display:grid;place-items:center;cursor:pointer}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;margin:24px 0 28px}
.meter{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 10px;min-width:0}
.meter .l{font:600 12px/1.2 var(--f-body);letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:600 21px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;margin-top:7px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.meter .d{font-size:12px}
.meter .track{height:3px;background:var(--surface-2);border-radius:2px;margin-top:9px;overflow:hidden}
.meter .track i{display:block;height:100%;background:var(--good);border-radius:2px}
.meter.warn .track i{background:var(--bad)}
.meter.approval .track i{background:var(--gold)}
.up{color:var(--good)} .dn{color:var(--bad)} .flat{color:var(--muted)}
.layout{display:grid;gap:28px}
@media (min-width:900px){.layout{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);align-items:start}}
.town-context{min-width:0}.desk-heading{margin-bottom:24px}.desk-heading h2,.town-heading h2{font:600 30px/1.15 var(--f-display);letter-spacing:-.035em;margin:8px 0 12px}.desk-heading p{margin:0 0 16px}.town-heading h2{font-size:23px}.town-heading p{margin:0}
.initiative-item{margin-top:16px}.initiative-item .t,.initiative-item .m{display:block}
.summary-heading{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.summary-number{font:600 30px/1.2 var(--f-display);letter-spacing:-.035em;margin-top:12px;font-variant-numeric:tabular-nums}.summary-number span{font-size:14px;font-weight:400;letter-spacing:0;color:var(--muted)}
.summary-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:20px 0}.summary-stats span{display:block;font-size:12px;color:var(--muted)}.summary-stats b{display:block;font-size:22px;margin-top:6px;font-weight:600;font-variant-numeric:tabular-nums}
.decision-summary p{margin:12px 0 0}.box h3{font-size:17px;font-weight:600;margin:0 0 16px}
details{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 20px}summary{cursor:pointer;min-height:44px;padding:16px 0;font-size:14px;font-weight:600}.details-content{padding:4px 0 20px}.details-content canvas{margin-bottom:20px}
.report-highlights{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.report-highlights .box{padding:16px}.report-highlights b,.report-highlights .note{display:block}.report-highlights b{font-size:21px;font-weight:600;line-height:1.3;margin:8px 0;font-variant-numeric:tabular-nums}
.mapcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.maptools{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.seg{display:inline-flex;max-width:100%;background:var(--surface-2);border-radius:8px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:8px 14px;min-width:44px;min-height:44px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent-ink);box-shadow:0 1px 3px rgba(41,35,31,.05)}
.mapwrap{background:var(--map-bg);position:relative;overflow:hidden}
#map{display:block;width:100%;touch-action:none;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.mapctl{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:10px;display:flex;flex-direction:column;gap:8px}
.mapctl button{width:44px;height:44px;border-radius:8px;border:1px solid var(--control-line);background:var(--surface);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 1px 4px rgba(41,35,31,.07);cursor:pointer}
.mapctl button:disabled{opacity:.4}
.mapctl button:active{transform:scale(.96)}
.mapinfo{padding:14px 16px;font-size:13px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);border-top:1px solid var(--line);min-height:44px}
.mapinfo b{color:var(--fg)}
.panel{min-width:0}
.tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin-bottom:24px}
.tabs button{border:0;background:none;padding:12px 14px;min-width:44px;min-height:44px;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--accent-ink);border-bottom-color:var(--accent-ink)}
.sect{font:600 12px/1.3 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:24px 0 12px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.item{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;text-align:left;width:100%;cursor:pointer}
.item:hover{border-color:var(--control-line)}
.item .no{font:600 12px/1.3 var(--f-mono);color:var(--muted);padding-top:3px;min-width:58px}
.item .t{font-weight:600;font-size:16px;line-height:1.3}
.item .m{font-size:13px;color:var(--muted);margin-top:7px}
.item .grow{flex:1;min-width:0}
.pill{display:inline-block;font:600 12px/1.2 var(--f-body);letter-spacing:.02em;padding:5px 8px;border-radius:5px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.council{background:var(--gold-tint);color:var(--gold)}
.pill.ok{background:var(--accent-tint);color:var(--good)}
.devtag{display:inline-block;margin-top:7px;padding:4px 8px;border-radius:5px;background:var(--surface-2);color:var(--muted);font:600 12px/1.2 var(--f-mono)}
.pill.no{background:#F8E8E3;color:var(--bad)}
.group{border:0;padding:0;display:flex;flex-direction:column;gap:14px}
.group .gh{font-size:13px;color:var(--muted);padding:4px 0}
.group .gh b{color:var(--fg)}
.note{font-size:13px;color:var(--muted);line-height:1.6}
.row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.row span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.row > :last-child{white-space:nowrap;flex:none}
.member-head{flex-wrap:wrap}.member-head > div{min-width:0}
.member .pill,.tally .pill{white-space:normal;max-width:100%;overflow-wrap:anywhere}
.member{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px}
.member .nm{font-weight:600;font-size:16px}
.pickbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pickbar #plotCount{font-size:15px;margin-right:4px}
.statement{margin:16px 0 0;padding:16px;border:0;background:var(--surface-2);border-radius:8px;font-size:14px;line-height:1.6}
.statement .eyebrow{display:block;margin-bottom:8px}
.tag{font:600 12px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--bad);background:#F8E8E3;border-radius:5px;padding:4px 6px;margin-left:8px;vertical-align:2px}
.relbar{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin-top:12px}
.relbar i{display:block;height:100%;background:var(--good)}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.actionbar .in{max-width:1180px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:14px;display:flex;align-items:center;justify-content:space-between;gap:16px}
#barnote{flex:1;min-width:0}#reviewBtn{flex:none}
.btn{border:1px solid var(--control-line);background:var(--surface);border-radius:8px;padding:12px 16px;min-width:44px;min-height:44px;font-weight:600;cursor:pointer;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.gold{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:10px 12px;font-size:14px;min-height:44px}
.sheet{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;justify-content:center;align-items:stretch}
.sheet .pane{background:var(--bg);width:100%;max-width:720px;overflow-y:auto;display:flex;flex-direction:column;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:760px){.sheet{align-items:center;padding:24px}.sheet .pane{max-height:100%;border-radius:10px;border:1px solid var(--line)}}
.sh-head{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding-block:24px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.sh-head h2{font:600 26px/1.15 var(--f-display);margin:8px 0 0;letter-spacing:-.035em;text-wrap:balance}
.sh-body{flex:1 0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:24px 32px;display:flex;flex-direction:column;gap:24px}
.sh-actions{position:sticky;bottom:0;margin-top:auto;z-index:2;display:flex;flex-wrap:wrap;gap:10px;background:var(--bg);border-top:1px solid var(--line);padding-block:14px calc(14px + env(safe-area-inset-bottom,0px))}
.sh-actions .btn{flex:1 1 auto}
.initform{flex:1 0 auto}
.diagnostics{border-top:1px solid var(--line);margin-top:24px;padding-top:24px}.diagnostics h3{margin-bottom:12px}.diagnostics p{margin:12px 0}.diagnostics-dates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.diagnostics-dates label{font-size:14px;min-width:0;display:flex;flex-direction:column;gap:6px}.diagnostics-dates input{width:100%;min-width:0;min-height:44px;border:1px solid var(--control-line);border-radius:8px;background:var(--surface);color:var(--fg);padding:10px;font:inherit;font-size:14px}.diagnostics-actions{position:sticky;bottom:0;background:var(--surface);padding:12px 0}.diagnostics-actions .btn{width:100%}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px}
/* Site-plan exhibits use actual grid coordinates; HTML keys remain legible on narrow screens. */
.plan-comparison{min-width:0;padding:18px}
.plan-reviewed{margin:8px 0 14px;overflow-wrap:anywhere}
.plan-switch{display:flex;flex-wrap:wrap;gap:8px}
.plan-switch .btn{flex:1 1 120px;white-space:normal}
.plan-switch [aria-pressed="true"]{border-color:var(--accent-ink);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--accent-ink)}
.plan-preview{margin:14px 0}
.plan-exhibit{margin:0;min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:#f6f2e8}
.plan-exhibit-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:12px 14px;font:12px var(--mono,monospace);text-transform:uppercase;letter-spacing:.06em}
svg.plan-illustration{display:block;width:100%;height:auto;max-height:430px;background:#eee9db}
.plan-legend,.plan-counts{display:flex;flex-wrap:wrap;gap:10px 16px;padding:12px 14px;font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.plan-legend{border-top:1px solid var(--line)}
.plan-legend span{display:inline-flex;align-items:center;gap:6px}
.plan-legend i{display:inline-block;width:12px;height:12px;border:1px solid #777}
.plan-price{margin:0;padding:0 14px 12px;font-size:13px}
.plan-caption{padding:0 14px 14px;font-size:12px;color:var(--muted);line-height:1.5}
.plan-no-site{padding:20px;font-size:14px}
.composition-form label,.composition-controls label{display:flex;flex-direction:column;gap:8px;min-width:0;font-size:13px}
.composition-form input,.composition-form select,.composition-form textarea,.composition-controls input,.composition-controls select{box-sizing:border-box;width:100%;min-width:44px;min-height:44px;border:1px solid var(--control-line);border-radius:6px;padding:10px 12px;background:var(--surface);color:var(--fg);font:inherit;font-size:15px}
.composition-form textarea{resize:vertical}
.composition-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:end}
.component-control{min-width:0;border:1px solid var(--control-line);border-radius:8px;padding:16px;margin:0;display:flex;flex-direction:column;gap:14px}
.component-control legend{padding:0 5px;font-size:13px;overflow-wrap:anywhere}
.composition-controls label.composition-check,.composition-check{display:flex;flex-direction:row;align-items:center;gap:12px;min-height:44px;font-size:13px;line-height:1.5}
.composition-check input[type=checkbox]{width:44px;height:44px;flex:0 0 44px;accent-color:var(--good)}
.composition-candidate{display:flex;flex-direction:column;gap:14px;min-width:0}
.composition-primary{position:sticky;bottom:0;background:var(--bg);padding:12px 0;z-index:2}
.composition-primary .btn{width:100%;min-height:48px}
.composition-forecast dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0}
.composition-forecast dt{font-size:12px;color:var(--muted)}.composition-forecast dd{margin:4px 0 0;font-size:16px;font-variant-numeric:tabular-nums}
.revision-identity{overflow-wrap:anywhere;font:12px var(--f-mono)}
.composition-controls .btn,.composition-form .btn{white-space:normal}
.storage-notice{overflow-wrap:anywhere}.tabs{flex-wrap:wrap}
@media(max-width:450px){.composition-grid{grid-template-columns:1fr}.composition-forecast dl{grid-template-columns:repeat(2,minmax(0,1fr))}.component-control{padding:14px}}
.request-feedback{overflow-wrap:anywhere}
.revision-summary{margin-top:16px;padding:16px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.revision-summary p{margin:6px 0 12px}
.revision-summary dl{margin:0;font-size:14px}
.revision-summary dl div{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;padding:8px 0;border-top:1px solid var(--line)}
.revision-summary dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.revision-summary .btn{margin-top:8px}
canvas.plan{width:100%;height:200px;display:block;border-radius:8px}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.stats3 .l{font-size:12px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stats3 .v{font:600 20px var(--f-mono);font-variant-numeric:tabular-nums;margin-top:5px}
.fc{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px 16px}
.fc div{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-bottom:1px solid var(--line);padding:8px 0}
.fc b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{border:1px solid var(--control-line);background:var(--surface);border-radius:8px;padding:10px 14px;min-width:44px;min-height:44px;font-size:14px;cursor:pointer}
.chip:hover{border-color:var(--accent-ink)}
.chat{display:flex;flex-direction:column;gap:12px;max-height:320px;overflow-y:auto;padding:3px}
.msg{max-width:92%;padding:14px 16px;border-radius:8px;font-size:14px;line-height:1.6}
.msg.them{background:var(--surface-2);align-self:flex-start}
.msg.you{background:var(--accent-tint);color:var(--fg);align-self:flex-end}
.msg.sys{align-self:center;background:var(--surface-2);color:var(--fg);font-size:13px;max-width:100%}
.msg .who{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:7px}
.composer{display:flex;gap:10px}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--control-line);background:var(--surface);color:var(--fg);border-radius:8px;padding:12px;font:inherit;font-size:14px;min-height:44px}
.planlist{display:flex;flex-wrap:wrap;gap:8px}
.planlist span{font-size:13px;background:var(--surface-2);border-radius:5px;padding:6px 10px}
.planlist span b{font-weight:600}
.leans{display:flex;flex-direction:column;gap:7px;margin-top:16px}

.lean .bar{height:6px;background:var(--surface-2);border-radius:3px;position:relative;overflow:hidden}

.courier .mast{font:700 26px/1.2 var(--f-news);text-align:center;letter-spacing:.01em;border-bottom:3px double var(--ink);padding-bottom:14px}
.courier .dl{display:flex;justify-content:space-between;gap:12px;font:400 italic 12px var(--f-news);padding:10px 0;border-bottom:1px solid var(--ink)}
.courier h3{font:700 25px/1.2 var(--f-news);margin:20px 0 12px;text-wrap:balance}
.courier p{font:400 15px/1.6 var(--f-news);margin:0}
.cause{display:grid;grid-template-columns:86px minmax(0,1fr) 54px;gap:12px;font-size:14px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.cause .k{font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.cause .n{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.big{font:600 46px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:14px 18px;border-radius:8px;font-size:14px;max-width:min(92vw,520px)}
.thinking{font-size:13px;color:var(--muted);font-style:italic}
.choice{display:flex;flex-direction:column;gap:14px}
.choice button{text-align:left;border:1px solid var(--control-line);background:var(--surface);border-radius:8px;padding:20px;min-width:44px;min-height:44px;cursor:pointer}
.choice button[aria-pressed="true"]{border-color:var(--accent-ink);box-shadow:inset 0 0 0 1px var(--accent-ink)}
.choice b{display:block;font-weight:600}
.choice small{display:block;color:var(--muted);font-size:13px;margin-top:7px}
@media (max-width:450px){
  .wrap{padding-inline:max(20px,env(safe-area-inset-left,0px)) max(20px,env(safe-area-inset-right,0px));padding-block:20px 150px}
  .hdr{gap:16px}.brand{gap:10px}h1{font-size:23px}
  .meters{gap:8px;margin:24px 0}.meter{padding:12px 10px}
  .layout{gap:24px}.item{padding:20px 16px;gap:10px;flex-wrap:wrap}.item .grow{flex-basis:180px}
  .box,.member,.courier{padding:20px}.stats3{gap:10px}
  .sh-head{padding:20px;gap:12px}.sh-head h2{font-size:24px}
  .sh-body{padding:24px 20px 32px;gap:24px}.sh-actions{gap:8px}
  .actionbar .in{padding-inline:max(20px,env(safe-area-inset-left,0px)) max(20px,env(safe-area-inset-right,0px));gap:12px}
  .actionbar .btn{flex:none}.cause{grid-template-columns:70px minmax(0,1fr) 46px;gap:8px}
  .actionbar .in{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}#barnote{grid-column:1/-1}.single-action #endBtn{grid-column:1/-1}
  .desk-heading h2{font-size:28px}.report-highlights{gap:8px}.report-highlights .box{padding:14px 10px}.report-highlights b{font-size:18px}.summary-stats{gap:10px}.summary-stats b{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="hdr">
    <div class="brand">
      <svg class="seal" viewBox="0 0 40 44" aria-hidden="true"><path d="M4 2h32l-4 12 4 4-6 24H10L4 18l4-4z" fill="var(--accent-ink)"/><path d="M12 30h16M14 24h12M20 9v26" stroke="var(--surface)" stroke-width="2.2" stroke-linecap="round"/></svg>
      <div><div class="eyebrow" id="scenarioName">Scenario 01 · Millbrooke</div><h1>Millbrooke, Pennsylvania</h1></div>
    </div>
    <div class="when"><div><div class="yr" id="yr">2027</div><div class="sub" id="yrsub"></div></div>
      <button class="iconbtn" id="menuBtn" aria-label="Game menu"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 5h12M3 9h12M3 13h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
  </header>
  <div class="layout">
    <section class="panel" aria-labelledby="deskTitle">
      <div class="desk-heading"><div class="eyebrow">Mayor’s desk</div><h2 id="deskTitle">Your agenda</h2><p class="note" id="deskNote"></p><button class="btn sm" data-act="showMap">View town</button></div>
      <div class="tabs" role="tablist"><button role="tab" data-tab="agenda">Agenda</button><button role="tab" data-tab="council">Council</button><button role="tab" data-tab="budget">Budget</button></div>
      <div id="panel"></div>
    </section>
    <section class="town-context" aria-label="Town context"><div class="town-heading"><h2>Where decisions land</h2><p class="note">Inspect a site to see its proposals or plan something there.</p></div>
    <section class="meters" id="meters" aria-label="Town meters"></section>

      <section class="mapcard" aria-label="Town map">
        <div class="maptools">
          <div class="seg" role="group" aria-label="Map view"><button id="vIso" aria-pressed="true">Street view</button><button id="vTop" aria-pressed="false">Plan view</button></div>
        </div>
        <div class="mapwrap"><canvas id="map" aria-label="Map of Millbrooke. Pinch to zoom, drag to pan, twist to rotate."></canvas>
          <div class="mapctl" role="group" aria-label="Map controls">
            <button data-map="in" aria-label="Zoom in"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
            <button data-map="out" aria-label="Zoom out"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
            <button data-map="center" aria-label="Recenter on downtown"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 1v4M10 15v4M1 10h4M15 10h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
            <button data-map="rotate" aria-label="Rotate street view"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 1-2-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M15 2v4h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </div>
        </div>
        <div class="mapinfo" id="mapinfo">Tap a building or site. Pinch to zoom, twist to rotate. Gold outlines are on your agenda; white ones are open for your ideas.</div>
      </section>

    </section>
  </div>
</div>
<div class="actionbar"><div class="in"><div class="note" id="barnote"></div><button class="btn primary" id="endBtn">End year</button><button class="btn primary" id="reviewBtn" hidden>Review next proposal</button></div></div>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script>/*ENGINE*/</script>
<script>/*UI*/</script>
